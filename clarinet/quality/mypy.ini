# mypy configuration for a clarinet downstream project.
#
# Posture is deliberately LENIENT, not strict: a config that greets a project
# with a wall of errors is a config that gets deleted. Turn flags on
# incrementally once the typed surface is clean.

[mypy]
# Bump alongside ruff.toml's target-version if your project targets a newer
# Python.
python_version = 3.12
plugins = pydantic.mypy
namespace_packages = True
explicit_package_bases = True

# mypy_path = plan
# Deliberately commented out (design D4) -- it only resolves pre-0.10 bare
# sibling imports (e.g. `from record_types import ...`). If mypy reports
# "Cannot find implementation" errors for your own plan/ modules, the fix is
# to migrate those imports to the clarinet_plan.-qualified form (see the
# override near the bottom of this file), not to uncomment this line.
exclude = (?x)(^tests/ | ^data/ | ^alembic/ | ^plan/lib/)

# --- Path to strict, in the order that hurts least -----------------------
# 1. disallow_untyped_defs = True
# 2. disallow_incomplete_defs = True
# 3. warn_return_any = True
# 4. finally the `strict` flag itself, which subsumes all of the above.
# ------------------------------------------------------------------------

# The pydantic-mypy plugin's init_typed option defaults to False. With it off,
# the plugin synthesizes a bare `__init__(**data: Any)` for every model, so
# mypy checks that a constructor call supplies the right *fields* but never
# checks their *types* -- a call like SomeModel(n="not an int") for a model
# declaring `n: int` type-checks clean. Flipping this on is what makes the
# coercion-aware FileDef/RecordDef constructors upstream (in
# clarinet/config/primitives.py) actually catch a wrong-typed argument; left
# off, that whole checking path is inert.
#
# Measured cost: zero. Checking clarinet_nir_liver/plan (the production
# project this config is derived from) with and without this flag produces
# byte-identical output -- whatever pre-existing errors that project
# currently carries, this flag adds none and removes none of them.
[pydantic-mypy]
init_typed = True

# 3D Slicer runtime imports — only available inside Slicer's embedded Python.
# SimpleITK publishes no stubs. Same list as clarinet's own [tool.mypy].
[mypy-ctk,qt,slicer,slicer.*,vtk,vtk.*,vtkSegmentationCorePython,DICOMLib,DICOMLib.*,SimpleITK,SimpleITK.*]
ignore_missing_imports = True

# Third-party libraries without a guaranteed py.typed marker across every
# version a project might pin. Some already ship one today (nibabel, skimage,
# pynetdicom, pydicom -- checked against this project's own pins), making
# this entry a no-op for them; harmless to keep, since it still covers older
# pins and the ones that don't (e.g. scipy, nrrd).
[mypy-nrrd.*,nibabel.*,skimage.*,scipy.*,pydicom.*,pynetdicom.*,totalsegmentator.*,openpyxl.*]
ignore_missing_imports = True

# THIS OVERRIDE IS THE Any GENERATOR, NOT A FIX.
#
# `clarinet_plan` is an in-memory anchor package created at startup by
# clarinet.config.plan_package — nothing exists on disk for mypy to resolve, so
# every cross-module import inside plan/ becomes Any. That is an inference the
# architecture forces, not a choice this project made.
#
# Tracked by radionest/clarinet#502. When that lands, a project can name its
# config directory `clarinet_plan/` (config_tasks_path) and DELETE this block to
# get real cross-module checking.
[mypy-clarinet_plan.*]
ignore_missing_imports = True
