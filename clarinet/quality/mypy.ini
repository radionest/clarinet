# mypy configuration for a clarinet downstream project.
#
# Posture is deliberately LENIENT, not strict: a config that greets a project
# with a wall of errors is a config that gets deleted. Turn flags on
# incrementally once the typed surface is clean.

[mypy]
# Bump alongside ruff.toml's target-version if your project targets a newer
# Python.
python_version = 3.12
plugins = pydantic.mypy
namespace_packages = True
explicit_package_bases = True

# mypy_path = plan
# Deliberately commented out -- it only resolves pre-0.10 bare
# sibling imports (e.g. `from record_types import ...`). If mypy reports
# "Cannot find implementation" errors for your own plan/ modules, the fix is
# to migrate those imports to the clarinet_plan.-qualified form (see the
# override near the bottom of this file), not to uncomment this line.
exclude = (?x)(^tests/ | ^data/ | ^alembic/ | ^plan/lib/)

# --- Path to strict, in the order that hurts least -----------------------
# 1. disallow_untyped_defs = True
# 2. disallow_incomplete_defs = True
# 3. warn_return_any = True
# 4. finally the `strict` flag itself, which subsumes all of the above.
# ------------------------------------------------------------------------

# The pydantic-mypy plugin's init_typed option defaults to False. With it
# off, the plugin synthesizes an __init__ that keeps one named parameter per
# field -- so a required field with no default still errors "Missing named
# argument" if omitted -- but types every one of those parameters `Any`
# instead of the field's real type (confirmed via reveal_type(Model.__init__):
# `n: Any` with the flag off, `n: int` with it on, for a model declaring
# `n: int`). The net effect: mypy still checks that a constructor call
# supplies the right *fields*, but never checks their *types* -- a call
# like SomeModel(n="not an int") for a model declaring `n: int` type-checks
# clean.
#
# This does NOT extend to FileDef/RecordDef (clarinet/config/primitives.py):
# both hand-write their own __init__, and the plugin skips synthesis
# whenever one already exists, so their explicit, coercion-aware signatures
# are authoritative regardless of this flag. Measured twice, independently:
# FileDef(pattern="x", level=123) and RecordDef(name="x", level=123,
# viewer_mode=99) produce 3 arg-type errors with init_typed on and off --
# identical output either way.
#
# What this flag actually buys is every OTHER pydantic model in a
# downstream project: anything that does not hand-write __init__, which is
# most models. For those, init_typed=True is what turns on the
# constructor-argument type check described above (confirmed separately: a
# plain BaseModel with no __init__ misses a bad constructor argument with
# the flag off and catches it with the flag on). Left at the default, that
# checking path is inert for them -- this is the real, large-surface
# justification for the flag.
#
# What this costs: nothing beyond real bugs. The flag can only ADD an
# error for a constructor call whose argument value doesn't match the
# field's declared type -- confirmed directly: a correctly-typed call is
# never flagged with the flag on, and an incorrectly-typed one is silently
# accepted with it off (see the reveal_type comparison above). If your own
# models are already constructed with correctly-typed arguments
# everywhere, enabling this changes nothing; if they aren't, what it
# surfaces are real bugs, not noise.
[pydantic-mypy]
init_typed = True

# 3D Slicer runtime imports — only available inside Slicer's embedded Python.
# SimpleITK publishes no stubs. Same list as clarinet's own [tool.mypy].
[mypy-ctk,qt,slicer,slicer.*,vtk,vtk.*,vtkSegmentationCorePython,DICOMLib,DICOMLib.*,SimpleITK,SimpleITK.*]
ignore_missing_imports = True

# Third-party libraries without a guaranteed py.typed marker across every
# version a project might pin. Some already ship one today (nibabel,
# skimage, pynetdicom, pydicom), making this entry a no-op for them --
# ignore_missing_imports only suppresses mypy's "missing library stubs or
# py.typed marker" error, so it has nothing to do once a library ships its
# own types. Harmless to keep either way: it still covers older pins and
# the libraries that don't ship one (e.g. scipy, nrrd).
[mypy-nrrd.*,nibabel.*,skimage.*,scipy.*,pydicom.*,pynetdicom.*,totalsegmentator.*,openpyxl.*]
ignore_missing_imports = True

# THIS OVERRIDE IS THE Any GENERATOR, NOT A FIX.
#
# `clarinet_plan` is an in-memory anchor package created at startup by
# clarinet.config.plan_package — nothing exists on disk for mypy to resolve, so
# every cross-module import inside plan/ becomes Any. That is an inference the
# architecture forces, not a choice this project made.
#
# Tracked by radionest/clarinet#502. When that lands, a project can name its
# config directory `clarinet_plan/` (config_tasks_path) and DELETE this block to
# get real cross-module checking.
[mypy-clarinet_plan.*]
ignore_missing_imports = True
