# Clarinet research project — settings.
# Secrets and host-specific values go in .env (copy .env.example); environment
# variables win over this file. settings.custom.toml loads after this file and
# holds commented production overrides.

# ── Project ──────────────────────────────────────────
project_name = "TODO: Project Name"
project_description = "TODO: short description of the research"
# project_title = "TODO: browser tab title"  # defaults to project_name
root_url = "/my_project"

# Custom roles beyond the standard admin / user / doctor / auto / expert.
# Any RecordDef.role that is not standard MUST appear here.
extra_roles = []

# ── Server / Logging ─────────────────────────────────
# Internal clients (RecordFlow, pipeline tasks) call
# http://<host>:<port><root_url>/api (a wildcard host 0.0.0.0 / :: becomes
# 127.0.0.1) unless api_base_url is set (see settings.custom.toml).
port = 8111
host = "0.0.0.0"
debug = true
log_level = "INFO"
log_console_level = "INFO"

# ── Database ─────────────────────────────────────────
database_driver = "postgresql+asyncpg"
# Name, host and credentials: .env (see .env.example).

# ── Storage ──────────────────────────────────────────
anon_id_prefix = "MY_PROJECT"

# ── Features ─────────────────────────────────────────
recordflow_enabled = true   # event-driven workflow
pipeline_enabled = true     # task queue (requires RabbitMQ)
frontend_enabled = true     # serve the SPA

# ── Python config mode ───────────────────────────────
# All paths below are relative to ``config_tasks_path``.
config_mode = "python"
config_tasks_path = "./plan/"
config_record_types_file = "definitions/record_types.py"
# config_context_hydrators_file defaults to "slicer_hydrators.py" (plan root)
recordflow_paths = ["./plan/workflows"]

# ── DICOM ────────────────────────────────────────────
dicom_retrieve_mode = "c-move"
anon_send_to_pacs = false

# ── External Viewers (tables stay last) ──────────────
# Viewers that support URI schemes (radiant://, weasis://, …);
# API: GET /api/records/{id}/viewers
#
# [viewers.radiant]
# enabled = true
# pacs_name = "MY_PACS"
#
# [viewers.weasis]
# enabled = true
# base_url = "http://pacs:8080/weasis-pacs-connector"
